name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # validate (Checkstyle) -> compile -> test (unit + Testcontainers; Docker is preinstalled on the runner)
      - name: Build and test
        run: ./mvnw -B verify

      - name: Check docker-compose file
        run: docker compose config --quiet

      - name: Build the Intake Service image
        run: docker build -f intake-service/Dockerfile -t claimstream/intake-service:ci .
